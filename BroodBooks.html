<title>BroodBooks</title>

<style>
:root{--bg:#0f1729;--c1:#18223a;--c2:#202d4d;--bd:#2f3f66;--tx:#eaeffb;--mu:#9aa7c7;--am:#ffb84d;--te:#38d2b2;--co:#ff7f86;--vi:#a08fff;--sky:#51bbff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#090e1b;color:var(--tx);font:14px/1.7 Vazirmatn,Tahoma,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}

.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--bd);background:var(--c1)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;letter-spacing:.2px}
.brand i{width:30px;height:30px;border-radius:10px;background:color-mix(in srgb,var(--am) 18%,transparent);color:var(--am);display:grid;place-items:center}
.ps{background:var(--c2);border:1px solid var(--bd);border-radius:12px;padding:6px 10px;max-width:58%;outline:0}

.nav{display:flex;border-top:1px solid var(--bd);background:var(--c1);padding:6px 4px}

.nav button.on{color:var(--sky)}
h2.pt{font-size:18px;font-weight:800;margin:2px 2px 10px}
.card{background:var(--c1);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px}
.dash{background:var(--c2)}
.dh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{display:inline-block;font-size:11.5px;padding:1px 9px;border-radius:99px;background:rgba(56,210,178,.14);color:var(--te)}
.chip.end{background:rgba(255,127,134,.14);color:var(--co)}
.age{font-size:30px;font-weight:800;color:var(--am);line-height:1.2;margin:6px 0 10px}
.age small{font-size:13px;color:var(--mu);font-weight:400;margin-inline-start:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini{background:var(--c1);border:1px solid var(--bd);border-radius:12px;padding:8px 10px}
.mini span,.stat span{display:block;font-size:12px;color:var(--mu)}

.sec{font-weight:800;margin:14px 2px 8px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa button{background:var(--c1);border:1px solid var(--bd);border-radius:16px;padding:12px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:var(--a);background:color-mix(in srgb,var(--a) 16%,transparent);flex:none}
.c-am{--a:var(--am)}.c-te{--a:var(--te)}.c-sky{--a:var(--sky)}.c-vi{--a:var(--vi)}.c-co{--a:var(--co)}
.rec{display:flex;align-items:center;gap:10px;width:100%;text-align:start;background:var(--c1);border:1px solid var(--bd);border-radius:16px;padding:10px 12px;margin-bottom:8px}
.rec .ic{width:38px;height:38px}
.rec .m{flex:1;min-width:0}.rec .m b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .m div{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mu)}
.rec .v{font-weight:800;font-size:13.5px}.rec>svg{color:var(--mu)}
.tw{position:relative;margin-bottom:10px}
.ti{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}

.tab{white-space:nowrap;padding:7px 15px;border-radius:99px;border:1px solid var(--bd);background:var(--c1);color:var(--mu);font-weight:600}
.tab.on{color:var(--sky);border-color:var(--sky);background:rgba(81,187,255,.12)}
.ar{position:absolute;inset-block:0;inset-inline-end:0;width:38px;display:grid;place-items:center;color:var(--sky);background:linear-gradient(to left,var(--bg) 55%,transparent)}
.ar[hidden]{display:none}
.sb .ti{background:var(--c2);border-radius:14px;padding:4px}
.sb .tab{border:0;background:transparent;border-radius:10px;padding:4px 12px;font-size:13px}
.sb .tab.on{background:var(--bd);color:var(--tx)}
.sb .ar{background:linear-gradient(to left,var(--c2) 55%,transparent);border-radius:14px}
.stats .stat:last-child:nth-child(odd){grid-column:span 2}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 14px;border-radius:14px;font-weight:600;min-height:44px}

.stat{background:var(--c1);border:1px solid var(--bd);border-radius:14px;padding:9px 12px}
.fo{display:flex;width:100%;justify-content:space-between;align-items:center;padding:10px 14px;border:1px dashed var(--bd);border-radius:14px;color:var(--te);font-weight:600;margin-bottom:10px}
.fo svg{transition:transform .2s}.fo.open svg{transform:rotate(-90deg)}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #263556}
.row:last-child{border:0}.row span{color:var(--mu)}.row b{text-align:end}
.pos{color:var(--te)}.neg{color:var(--co)}
.na{color:var(--am);font-weight:400;font-size:12.5px}
.lh{font-weight:800;margin:6px 2px 8px}.lh em{font-style:normal;color:var(--mu);font-weight:400}
fieldset{border:1px solid var(--bd);border-radius:12px;padding:0 12px 6px;margin-bottom:12px;min-width:0}
fieldset:focus-within{border-color:var(--sky)}
fieldset.err{border-color:var(--co)}
legend{padding:0 6px;font-size:12.5px;color:var(--mu)}
fieldset input,fieldset select,fieldset textarea{width:100%;background:transparent;border:0;outline:0;padding:8px 2px;resize:none}
fieldset input::placeholder,textarea::placeholder{color:#62708f}
.em{display:block;color:var(--co);font-size:12px}.em:empty{display:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.calc{padding:8px 2px;font-weight:800;color:var(--am)}
.hint{font-size:12px;color:var(--te);padding-bottom:2px}.hint:empty{display:none}
.info{background:var(--c2);border-radius:12px;padding:8px 12px;margin:-2px 0 12px}.info:empty{display:none}
.info div{display:flex;justify-content:space-between;padding:2px 0;font-size:13px}.info span{color:var(--mu)}
.warn{color:var(--am)}
.ft{font-weight:800;margin-bottom:12px}
.acts{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.empty{text-align:center;color:var(--mu);padding:26px 14px;border:1px dashed var(--bd);border-radius:18px}
.empty svg{color:var(--bd);margin-bottom:6px}
.blank{border:1px dashed var(--bd);border-radius:20px;min-height:55vh}
.ov{position:fixed;inset:0;background:rgba(7,11,22,.62);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.ov.mo{align-items:flex-end;padding-bottom:84px}
.md{background:var(--c1);border:1px solid var(--bd);border-radius:22px;width:100%;max-width:440px;max-height:82vh;overflow:auto;padding:14px}
.mh{display:flex;gap:8px;align-items:center;margin-bottom:8px}.sp{flex:1}
.ib{display:inline-flex;gap:5px;align-items:center;padding:6px 12px;border-radius:12px;border:1px solid var(--bd);font-size:13px;min-height:38px}
.ib.dan{color:var(--co);border-color:rgba(255,127,134,.5)}
.md h3{font-size:17px}.md .sub{color:var(--mu);font-size:12.5px;margin-bottom:8px}
.lnk{color:var(--sky);border:1px solid var(--sky);border-radius:10px;padding:2px 10px;font-size:12.5px}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:440px}
.mg button{background:var(--c1);border:1px solid var(--bd);border-radius:22px;padding:18px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600}
.mg button:last-child{grid-column:span 2}
.ban{display:flex;gap:8px;align-items:center;justify-content:space-between;background:rgba(255,127,134,.12);border:1px solid rgba(255,127,134,.5);border-radius:14px;padding:10px 12px;margin-bottom:10px;font-size:13px}
.ban button{color:var(--sky);white-space:nowrap}
.toast{position:absolute;inset-inline:16px;bottom:84px;background:var(--te);color:#032a22;padding:10px 14px;border-radius:14px;font-weight:600;text-align:center;z-index:60}
.toast.e{background:var(--co);color:#3a0508}
.note{font-size:12px;color:var(--mu);margin:8px 2px}
.sk{height:74px;border-radius:16px;margin-bottom:10px;background:var(--c1)}
@media (prefers-reduced-motion:no-preference){.sk{background:linear-gradient(90deg,var(--c1) 25%,var(--c2) 50%,var(--c1) 75%);background-size:200% 100%;animation:sh 1.1s infinite}@keyframes sh{to{background-position:-200% 0}}}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:6px 0 8px}
.ck{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd);background:var(--c2);border-radius:99px;padding:3px 12px;font-size:13px}
.ck input{width:auto!important;accent-color:var(--sky)}
.car,.pr{background:var(--c2);border-radius:14px;padding:8px 10px;margin:8px 0}
.car fieldset,.pr fieldset{margin:8px 0 0;background:var(--c1)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px;margin-bottom:6px}
fieldset input:disabled{opacity:.4}
[hidden]{display:none!important}
.rec.off{--a:var(--mu);opacity:.62;border-style:dashed;background:transparent}
.rec.off .m b{color:var(--mu);text-decoration:line-through}
</style></head>

const dep=['chick','drug','feed','sale'].includes(k)?recs(k=='sale'?'retSale':'retBuy').filter(z=>z.ref==id):[];
if(dep.length)rows+=row('رکوردهای برگشت وابسته',dep.map(z=>`<button class="lnk" data-a="det" data-id="${z.id}">${toFa(z.date)}</button>`).join(' '));
if(k=='exp'||k=='inc')rows+=row('منشأ','سند دستی');
rows+=row('توضیحات تکمیلی',esc(r.note||'—'));
return `<div class="mh"><button class="ib" data-a="edit" data-id="${id}">${ic('edit')} ویرایش</button><button class="ib dan" data-a="ask" data-id="${id}">${ic('trash')} حذف</button><span class="sp"></span>${S.modal.length>1?`<button class="ib" data-a="back">${ic('fwd')}</button>`:''}<button class="ib" data-a="close">${ic('x')}</button></div><h3>${c.t}</h3><div class="sub">${toFa(r.date)}</div>${rows}`}
function ask(id){const x=find(id),n=['chick','drug','feed','sale'].includes(x.k)?recs(x.k=='sale'?'retSale':'retBuy').filter(z=>z.ref==id).length:0;
return `<h3>حذف رکورد؟</h3><p style="margin:8px 0;color:var(--mu)">این رکورد از دوره و گزارش‌ها حذف می‌شود و قابل بازگشت نیست.${n?` ${F(n)} رکورد برگشت وابسته نیز حذف خواهد شد.`:''}</p><div class="acts" style="grid-template-columns:1fr 1fr"><button class="btn pr" style="background:var(--co);color:#3a0508" data-a="del" data-id="${id}">بله، حذف شود</button><button class="btn gh" data-a="back">انصراف</button></div>`}
// ---------- shell ----------
function render(top){const old=$('#fm'),keep=old&&S.form&&old.dataset.k==S.form.k&&+old.dataset.id==S.form.id?old:null;const m=$('main'),sc=m&&!top?m.scrollTop:0,p=cur(),s=S.sec,more=['trade','wh','prod','tre','fin'].includes(s);
let body;if(S.ld)body='<div class="sk"></div>'.repeat(4);else body=`<h2 class="pt">${SECN[s]}</h2>`+(s=='home'?home():s=='trade'?trade():s=='fin'?fin():s=='rep'?rep():s=='base'?base():blank());
const nv=(k,l,i)=>`<button data-a="nav" data-s="${k}" class="${s==k&&!S.more?'on':''}">${ic(i)}<span>${l}</span></button>`;
const md=S.modal[S.modal.length-1];
$('#app').innerHTML=`<header class="bar"><div class="brand"><i>${ic('chick')}</i>BroodBooks</div><select class="ps${isEnd(p)?' end':''}" data-a="ps">${P.map(q=>`<option value="${q.id}" ${q.id==p.id?'selected':''}>${q.name} · ${STN[q.st]}</option>`).join('')}</select></header><main>${body}</main>
<nav class="nav">${nv('home','خانه','home')}${nv('base','پایه','db')}${nv('rep','گزارش‌ها','chart')}<button data-a="more">${ic('menu')}<span>بیشتر</span></button></nav>
${S.more?`<div class="ov mo"><div class="mg">${[['trade','تبادلات تجاری','trade','sky'],['wh','تبادلات انبار','box','am'],['prod','تبادلات تولید','fac','vi'],['tre','تبادلات خزانه','wal','te'],['fin','تبادلات مالی','doc','co']].map(x=>`<button class="c-${x[3]}" data-a="nav" data-s="${x[0]}"><span class="ic">${ic(x[2])}</span>${x[1]}</button>`).join('')}</div></div>`:''}
${md?`<div class="ov"><div class="md">${md.t=='ask'?ask2(md.id):md.t=='cfm'?cfm(md):detail2(md.id)}</div></div>`:''}`;
$('main').scrollTop=sc;if(keep&&$('#fm'))$('#fm').replaceWith(keep);const fm=$('#fm');if(fm)upd(fm);
document.querySelectorAll('.tw').forEach(w=>{const t=w.querySelector('.ti'),a=w.querySelector('.ar'),u=()=>{a.hidden=Math.abs(t.scrollLeft)+t.clientWidth>=t.scrollWidth-4};const on=t.querySelector('.on');if(on)t.scrollLeft+=on.getBoundingClientRect().left+on.offsetWidth/2-(t.getBoundingClientRect().left+t.clientWidth/2);t.onscroll=u;u()})}
const load=()=>{S.ld=true;render(true);setTimeout(()=>{S.ld=false;render(true)},380)};
function toast(m,e){const d=document.createElement('div');d.className='toast'+(e?' e':'');d.textContent=m;$('#app').append(d);setTimeout(()=>d.remove(),2200)}
function goK(k){S.form=null;S.modal=[];if(K[k].g){S.sec='base';S.sub.base=BM[k];if(BM[k]!='ppl')S.b2[BM[k]]=k;else S.b2.ppl='all';return}if(k=='exp'||k=='inc'){S.sec='fin';S.sub.fin=k}else{S.sec='trade';if(BUY.includes(k)){S.sub.trade='buy';S.buy=k}else S.sub.trade=k}}
document.addEventListener('click',e=>{
if(e.target.classList.contains('ov')){S.modal=[];S.more=false;render();return}
const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,d=el.dataset;
if(a=='ps')return;
if(a=='nav'){S.sec=d.s;S.more=false;S.form=null;S.modal=[];S.banner=null;load()}
else if(a=='more'){S.more=!S.more;render()}
else if(a=='tab'){if(d.g=='buy')S.buy=d.v;else if(d.g=='b2')S.b2[S.sub.base]=d.v;else S.sub[S.sec]=d.v;S.form=null;S.banner=null;render(true)}
else if(a=='sc'){const t=el.parentNode.querySelector('.ti');t.scrollBy({left:-170,behavior:'smooth'})}
else if(a=='go'){S.sec='trade';goK(d.k);S.form={k:d.k,id:0};render(true)}
else if(a=='newf'){S.form={k:d.k,id:0};render()}
else if(a=='cancel'){S.form=null;render()}
else if(a=='fo'){S.fo=!S.fo;render()}
else if(a=='det'){S.modal.push({t:'det',id:+d.id});render()}
else if(a=='close'){S.modal=[];render()}
else if(a=='back'){S.modal.pop();render()}
else if(a=='edit'){const k=find(+d.id).k;goK(k);S.form={k,id:+d.id};render(true)}
else if(a=='ask'){S.modal.push({t:'ask',id:+d.id});render()}
else if(a=='del'){const id=+d.id,x=find(id);DB[S.pid][x.k]=DB[S.pid][x.k].filter(r=>r.id!=id);for(const k of ['retBuy','retSale'])if(DB[S.pid][k])DB[S.pid][k]=DB[S.pid][k].filter(r=>r.ref!=id);S.modal=[];render();toast('رکورد حذف شد.')}
else if(a=='save'){const fm=$('#fm'),k=fm.dataset.k,id=+fm.dataset.id,E=chk(fm,true);if(Object.keys(E).length){const f=fm.querySelector('fieldset.err');if(f)f.scrollIntoView({block:'center'});toast('لطفاً خطاهای فرم را برطرف کنید.',1);return}
const v=collect(fm,k);if(k.startsWith('ret'))v.rk=find(v.ref).k;prep(k,v,id?find(id).r:null);const gp=K[k].g?0:S.pid,L=DB[gp][k]=DB[gp][k]||[];if(id)Object.assign(L.find(r=>r.id==id),v);else{const nid=uid++;L.push({id:nid,...v});if(k=='cyc')DB[nid]={}}S.form=null;render();toast(id?'رکورد ویرایش شد.':'رکورد ثبت شد.')}
else if(a=='imp'){S.banner='خواندن فایل ممکن نیست: ورود Excel در این نمونه اولیه به سرویس متصل نیست.';render()}
else if(a=='nb'){S.banner=null;render()}
else if(a=='exp')toast('خروجی Excel در نمونه اولیه شبیه‌سازی شد.')
else if(a=='delg'){const id=+d.id,x=find(id),L=DB[0][x.k];L.splice(L.findIndex(r=>r.id==id),1);if(x.k=='cyc'){delete DB[id];if(S.pid==id)S.pid=P[0].id}S.modal=[];render();toast('رکورد حذف شد.')}
else if(a=='off'||a=='on'){find(+d.id).r.off=a=='off';S.modal=[];render();toast(a=='off'?'رکورد غیرفعال شد.':'رکورد فعال شد.')}
else if(a=='cs'){S.modal.push({t:'cfm',id:+d.id,to:d.to});render()}
else if(a=='cfmok'){const p=find(+d.id).r;p.st=d.to;if(d.to=='closed')p.snap1=jal(new Date());if(d.to=='settled')p.snap2=jal(new Date());S.modal=[];render();toast('وضعیت دوره تغییر کرد.')}
else if(a=='addcar')$('#fm .cars').insertAdjacentHTML('beforeend',carRow({}));
else if(a=='rmcar')el.closest('.car').remove()});
document.addEventListener('change',e=>{if(e.target.matches('.ps')){S.pid=+e.target.value;S.form=null;S.modal=[];S.banner=null;load()}});
['input','change'].forEach(t=>document.addEventListener(t,e=>{const fm=e.target.closest&&e.target.closest('#fm');if(fm)upd(fm,e)}));
render();
</script></body></html>
